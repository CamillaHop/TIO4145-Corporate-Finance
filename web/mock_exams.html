<header class="hero section-hero">
  <div class="container">
    <p class="eyebrow"><a href="exam.html">← Exam prep</a></p>
    <h1>Mock exams</h1>
    <p class="lede">Four full mock papers in the Inspera format. Sit one interactively in the browser, or grab the Overleaf zip if you'd rather work on paper.</p>
  </div>
</header>

<main class="container section-content" id="main">
  <section class="mock-home">
    <div id="root">
      <p class="empty-state"><span>Loading mock papers…</span></p>
    </div>
  </section>
</main>

<footer>
  <div class="container footer-row">
    <a class="footer-btn" href="curriculum.html">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4z"/><path d="M4 10h16"/></svg>
      Curriculum
    </a>
    <span class="footer-meta"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v12H4z"/><path d="m4 7 8 6 8-6"/></svg>Spot a mistake? Contact Camilla</span>
    <span class="footer-tag">NTNU · TIØ4145</span>
  </div>
</footer>

<script>
(function () {
  function init() {
    StudySite.loadConfig().then(function (cfg) {
      StudySite.applyCourseChrome(cfg);
      StudySite.maybeLoadChat(cfg);
      return Promise.all([StudySite.ensureMarkdown(), StudySite.loadExam(), StudySite.ensureKatex()])
        .then(function (vals) {
          render(vals[1]);
          StudySite.renderMath(document.getElementById('root'));
        });
    }).catch(function (err) {
      document.getElementById('root').innerHTML =
        '<div class="empty-state"><p>No exam prep generated yet. Run <code>python scripts/generate_exam.py</code>.<br><br><em>' +
        StudySite.escapeHtml(err.message) + '</em></p></div>';
    });
  }

  function render(data) {
    var mocks = Array.isArray(data.mock_exams) ? data.mock_exams : [];
    if (!mocks.length) {
      document.getElementById('root').innerHTML =
        '<div class="empty-state"><p>No mock exams listed in <code>exam_prep.json</code>.</p></div>';
      return;
    }
    var html = ['<div class="mock-home-grid">'];
    mocks.forEach(function (m, i) {
      if (!m || typeof m !== 'object') return;
      var mid   = StudySite.escapeHtml(m.id || ('mock_0' + (i + 1)));
      var num   = StudySite.escapeHtml((i + 1).toString().padStart(2, '0'));
      var focus = Array.isArray(m.focus_topics) ? m.focus_topics : [];
      html.push(
        '<article class="mock-tile">' +
          '<a class="mock-tile-link" href="mock_exam.html?id=' + encodeURIComponent(m.id || '') + '">' +
            '<div class="mock-tile-num" aria-hidden="true">' + num + '</div>' +
            '<div class="mock-tile-body">' +
              '<h2 class="mock-tile-title">' + StudySite.renderInline(m.title || mid) + '</h2>' +
              (m.summary
                ? '<p class="mock-tile-summary">' + StudySite.renderInline(m.summary) + '</p>'
                : '') +
              (focus.length
                ? '<ul class="mock-tile-tags">' +
                    focus.map(function (f) { return '<li>' + StudySite.escapeHtml(f) + '</li>'; }).join('') +
                  '</ul>'
                : '') +
            '</div>' +
          '</a>' +
          '<footer class="mock-tile-foot">' +
            '<a class="mock-tile-cta" href="mock_exam.html?id=' + encodeURIComponent(m.id || '') + '">' +
              'Sit interactively →' +
            '</a>' +
            '<a class="mock-tile-zip" href="../generated/exam/tex/' + mid + '.zip" download ' +
                'title="LaTeX project zip — upload to Overleaf">' +
              '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>' +
              '<span>Overleaf zip</span>' +
            '</a>' +
          '</footer>' +
        '</article>'
      );
    });
    html.push('</div>');
    document.getElementById('root').innerHTML = html.join('');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else { init(); }
})();
</script>

</body>
</html>
