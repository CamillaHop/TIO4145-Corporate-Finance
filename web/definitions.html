<script>
(function () {
  var defsData = [];

  function init() {
    StudySite.loadConfig().then(function (cfg) {
      StudySite.applyCourseChrome(cfg);
      StudySite.maybeLoadChat(cfg);
      return Promise.all([StudySite.ensureMarkdown(), StudySite.loadExam(), StudySite.ensureKatex()])
        .then(function (vals) {
          defsData = Array.isArray(vals[1].key_definitions) ? vals[1].key_definitions : [];
          render();
          StudySite.renderMath(document.getElementById('root'));
          wireFilter();
        });
    }).catch(function (err) {
      document.getElementById('root').innerHTML =
        '<div class="empty-state"><p>No exam prep generated yet. Run <code>python scripts/generate_exam.py</code>.<br><br><em>' +
        StudySite.escapeHtml(err.message) + '</em></p></div>';
    });
  }

  function render() {
    if (!defsData.length) {
      document.getElementById('root').innerHTML =
        '<div class="empty-state"><p>No definitions in <code>exam_prep.json</code>.</p></div>';
      return;
    }
    var html = ['<dl class="defs-dl">'];
    defsData.forEach(function (d, i) {
      if (!d || typeof d !== 'object') return;
      var hay = ((d.term || '') + ' ' + (d.definition || '')).toLowerCase();
      html.push('<dt data-i="' + i + '" data-search="' + StudySite.escapeHtml(hay) + '">' +
                  StudySite.renderInline(d.term || '') + '</dt>');
      html.push('<dd data-i="' + i + '" data-search="' + StudySite.escapeHtml(hay) + '">' +
                  StudySite.renderInline(d.definition || '') + '</dd>');
    });
    html.push('</dl>');
    document.getElementById('root').innerHTML = html.join('');
    document.getElementById('defs-count').textContent = defsData.length + ' terms';
  }

  function wireFilter() {
    var input = document.getElementById('defs-filter');
    var emptyEl = document.getElementById('defs-empty');
    if (!input) return;
    var rows = document.querySelectorAll('#root .defs-dl > dt, #root .defs-dl > dd');

    function apply() {
      var q = input.value.trim().toLowerCase();
      var visible = 0;
      // dt and dd alternate; iterate dt and toggle its paired dd together.
      var dts = document.querySelectorAll('#root .defs-dl > dt');
      dts.forEach(function (dt) {
        var dd = dt.nextElementSibling;
        var hit = !q || (dt.getAttribute('data-search') || '').indexOf(q) !== -1;
        dt.hidden = !hit;
        if (dd) dd.hidden = !hit;
        if (hit) visible++;
      });
      emptyEl.hidden = visible !== 0;
      document.getElementById('defs-count').textContent =
        q ? (visible + ' of ' + dts.length) : (dts.length + ' terms');
    }

    input.addEventListener('input', apply);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { input.value = ''; apply(); input.blur(); }
    });
    apply();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else { init(); }
})();
</script>
