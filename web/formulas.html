<header class="hero">
  <div class="container">
    <p class="eyebrow">Reference</p>

    <p class="lede">Every display-mode formula extracted from the section notes and key concepts. Search across all of them, or narrow to one section.</p>
  </div>
</header>

<main class="container" id="main">
  <div class="formula-toolbar">
    <input type="search" id="formula-search" class="formula-search" placeholder="Search formulas…" autocomplete="off" spellcheck="false" />
    <select id="formula-section" aria-label="Filter by section">
      <option value="">All sections</option>
    </select>
    <div class="formula-filter" role="group" aria-label="Filter by memorisation">
      <button type="button" class="ff-btn is-active" data-filter="all">All</button>
      <button type="button" class="ff-btn" data-filter="memorize">Memorize</button>
      <button type="button" class="ff-btn" data-filter="sheet">On sheet</button>
    </div>
    <span class="formula-count" id="formula-count">—</span>
  </div>
  <div id="formula-groups">
    <p class="empty-state"><span>Loading formulas…</span></p>
  </div>
</main>

<script>
(function () {
  var allItems = [];   // flat list of every formula, used for filtering

  function init() {
    StudySite.loadConfig().then(function (cfg) {
      StudySite.applyCourseChrome(cfg);
      StudySite.maybeLoadChat(cfg);
      var sections = (cfg.sections || []);
      populateSectionFilter(sections);

      // Fetch every section's JSON in parallel; 404s just skip silently.
      // Also fetch the formula-sheet classification so we can badge each
      // formula as "on the sheet" vs "must memorize".
      return Promise.all(sections.map(function (s) {
        return Promise.all([
          StudySite.loadSection(s.id).catch(function () { return null; }),
          StudySite.loadFormulaSheet(s.id).catch(function () { return null; })
        ]);
      })).then(function (pairs) {
        return StudySite.ensureKatex().then(function () {
          var groups = [];
          pairs.forEach(function (pair, i) {
            var data = pair[0];
            if (!data) return;
            var section = sections[i];
            var sheetSet = buildSheetSet(pair[1]);
            var items = collectFormulas(section, data, sheetSet);
            if (items.length) groups.push({ section: section, items: items });
          });
          renderGroups(groups);
          // Wait for the renderMath pass to actually finish before binding
          // the filter — KaTeX rewrites the DOM and we want a stable tree.
          StudySite.renderMath(document.getElementById('formula-groups'));
          bindFilter();
        });
      });
    }).catch(function (err) {
      document.getElementById('formula-groups').innerHTML =
        '<div class="empty-state"><p>Could not load formulas: ' +
        StudySite.escapeHtml(err.message) + '</p></div>';
    });
  }

  function populateSectionFilter(sections) {
    var sel = document.getElementById('formula-section');
    if (!sel) return;
    sections.forEach(function (s) {
      var opt = document.createElement('option');
      opt.value = s.id;
      opt.textContent = s.title || s.id;
      sel.appendChild(opt);
    });
  }

  // Walk a section's JSON and extract every display-mode formula. Tags
  // each one with `source`/`concept` so the chip in the UI can say where
  // it came from, and builds a lowercase token blob for client-side
  // filtering (KaTeX-rendered DOM is hard to grep, so we derive search
  // tokens from the raw LaTeX).
  // Build a Set of normalized on-sheet LaTeX strings from a section's
  // formula_sheet JSON, so we can test each rendered formula for membership.
  function buildSheetSet(sheetData) {
    var set = Object.create(null);
    var list = sheetData && Array.isArray(sheetData.on_sheet) ? sheetData.on_sheet : [];
    list.forEach(function (f) {
      if (f && f.latex) set[StudySite.normalizeLatex(f.latex)] = true;
    });
    return set;
  }

  function collectFormulas(section, data, sheetSet) {
    var items = [];

    StudySite.extractGeneralFormulas(data.detailed_notes || '').forEach(function (tex) {
      items.push({
        section: section.id,
        sectionTitle: section.title || section.id,
        source: 'notes',
        concept: '',
        latex: tex,
        onSheet: !!sheetSet[StudySite.normalizeLatex(tex)]
      });
    });

    (Array.isArray(data.key_concepts) ? data.key_concepts : []).forEach(function (k) {
      if (!k || typeof k !== 'object') return;
      StudySite.extractGeneralFormulas(k.explanation || '').forEach(function (tex) {
        items.push({
          section: section.id,
          sectionTitle: section.title || section.id,
          source: 'concept',
          concept: k.concept || '',
          latex: tex,
          onSheet: !!sheetSet[StudySite.normalizeLatex(tex)]
        });
      });
    });

    // Build search tokens. Drop backslashes (so `\beta` matches "beta")
    // and other syntax noise; keep alphanumerics + the concept name and
    // section title.
    items.forEach(function (it) {
      var raw = (it.latex + ' ' + it.sectionTitle + ' ' + it.concept).toLowerCase();
      it.tokens = raw.replace(/[\\{}_^]+/g, ' ').replace(/\s+/g, ' ').trim();
    });

    return items;
  }

  function renderGroups(groups) {
    var wrap = document.getElementById('formula-groups');
    if (!groups.length) {
      wrap.innerHTML = '<div class="empty-state"><p>No display-mode formulas found across the course.</p></div>';
      updateCount(0, 0);
      return;
    }
    allItems = [];
    var html = groups.map(function (g) {
      var items = g.items.map(function (it) {
        allItems.push(it);
        var concept = it.concept
          ? '<span class="formula-concept">' + StudySite.escapeHtml(it.concept) + '</span>'
          : '';
        var badge = it.onSheet
          ? '<span class="fs-badge" title="Provided on the official formula sheet">On sheet</span>'
          : '';
        return (
          '<li class="formula-item" data-section="' + StudySite.escapeHtml(it.section) +
            '" data-onsheet="' + (it.onSheet ? '1' : '0') +
            '" data-tokens="' + StudySite.escapeHtml(it.tokens) + '">' +
            concept + badge +
            '<div class="formula-latex">$$' + it.latex + '$$</div>' +
          '</li>'
        );
      }).join('');
      return (
        '<section class="formula-group" data-section="' + StudySite.escapeHtml(g.section.id) + '">' +
          '<h2 class="formula-group-head">' +
            '<a href="section.html?id=' + encodeURIComponent(g.section.id) + '">' +
              StudySite.escapeHtml(g.section.title || g.section.id) +
            '</a>' +
          '</h2>' +
          '<ul class="formula-list">' + items + '</ul>' +
        '</section>'
      );
    }).join('');
    wrap.innerHTML = html;
    updateCount(allItems.length, allItems.length);
  }

  function bindFilter() {
    var input = document.getElementById('formula-search');
    var sel = document.getElementById('formula-section');
    var ffButtons = document.querySelectorAll('.formula-filter .ff-btn');
    var mode = 'all';   // 'all' | 'memorize' | 'sheet'
    function apply() {
      var q = (input.value || '').toLowerCase().trim();
      var sectionFilter = sel.value;
      var visible = 0;
      document.querySelectorAll('.formula-group').forEach(function (g) {
        if (sectionFilter && g.getAttribute('data-section') !== sectionFilter) {
          g.hidden = true;
          return;
        }
        var anyVisible = false;
        g.querySelectorAll('.formula-item').forEach(function (li) {
          var onSheet = li.getAttribute('data-onsheet') === '1';
          var modeHit = mode === 'all' ||
            (mode === 'sheet' && onSheet) ||
            (mode === 'memorize' && !onSheet);
          var hit = modeHit && (!q || (li.getAttribute('data-tokens') || '').indexOf(q) !== -1);
          li.hidden = !hit;
          if (hit) { anyVisible = true; visible++; }
        });
        g.hidden = !anyVisible;
      });
      updateCount(visible, allItems.length);
    }
    input.addEventListener('input', apply);
    sel.addEventListener('change', apply);
    ffButtons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        mode = btn.getAttribute('data-filter') || 'all';
        ffButtons.forEach(function (b) { b.classList.toggle('is-active', b === btn); });
        apply();
      });
    });
  }

  function updateCount(shown, total) {
    var el = document.getElementById('formula-count');
    if (!el) return;
    el.textContent = shown === total
      ? total + ' formula' + (total === 1 ? '' : 's')
      : shown + ' / ' + total;
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else { init(); }
})();
</script>

</body>
